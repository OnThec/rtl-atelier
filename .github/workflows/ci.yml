name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify (Test, Build, Smoke)
        run: npm run verify
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rtl-atelier-ci
          path: dist/*.zip
